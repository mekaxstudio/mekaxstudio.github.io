<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#0E0E12">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Unbounded:wght@600;800&display=swap">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    {% include logo.html %}
    <nav>
      <a href="{{ '/games/' | relative_url }}"{% if page.nav == 'games' %} aria-current="page"{% endif %}>Games</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© {{ site.time | date: '%Y' }} Mekax Studio · <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p class="footer-links">{% for g in site.data.games %}<a href="{{ '/' | append: g.slug | append: '/' | relative_url }}">{{ g.name }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}</p>
  </div>
</footer>
</body>
</html>
